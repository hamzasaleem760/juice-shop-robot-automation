name: Automation CI & Security Baseline

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          pip install robotframework-robocop robotframework-tidy

      - name: Run Robotidy Format Check
        run: robotidy --check .

      - name: Run Robocop Static Analysis
        run: robocop resources/ tests/

  test-execution:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (for Playwright engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          rfbrowser init

      - name: Determine Test Tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TAG_FILTER=--include smoke" >> $GITHUB_OUTPUT
          else
            echo "TAG_FILTER=" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests in Parallel with Pabot
        run: |
          mkdir -p results
          pabot --processes 3 ${{ steps.tags.outputs.TAG_FILTER }} --outputdir results tests

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: results/

  zap-security-scan:
    needs: test-execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          fail_action: false
        continue-on-error: true

  publish-gh-pages:
    needs: test-execution
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: robot-framework-reports
          path: public-reports

      - name: Deploy Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports